<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5E6D3">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Mit Groeni Richtung Balkan — Dirk & Lisa</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root {
  --bg: #FBF7F0;
  --bg2: #F5E6D3;
  --card: #fff;
  --text: #3D3229;
  --text2: #5A4E42;
  --text3: #A0937E;
  --accent: #D4845A;
  --accent2: #C4704B;
  --sage: #8FA47E;
  --sage-bg: rgba(143,164,126,0.12);
  --accent-bg: rgba(212,132,90,0.12);
  --border: rgba(61,50,41,0.1);
  --shadow: 0 2px 16px rgba(61,50,41,0.06);
  --radius: 14px;
  --font: 'DM Sans', system-ui, sans-serif;
  --serif: 'Lora', Georgia, serif;
  --hand: 'Caveat', cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg2)}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}

/* ─── HERO ─── */
.hero{padding:52px 20px 28px;background:linear-gradient(180deg,#F5E6D3 0%,var(--bg) 100%)}
.hero-inner{max-width:680px;margin:0 auto}
.eyebrow{font-family:var(--hand);font-size:20px;color:var(--accent);margin-bottom:4px}
.title{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.2;color:#2D2418;margin-bottom:8px}
.subtitle{font-size:14px;color:var(--text3);line-height:1.5;max-width:500px}

/* ─── STATS ─── */
.stats-banner{margin:24px 0 0;padding:18px 16px;background:linear-gradient(135deg,#F0DCC8,#E8CCAE);border-radius:var(--radius);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat-val{font-family:var(--hand);font-size:30px;font-weight:600;color:var(--text);line-height:1}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#8A7560;margin-top:3px}

/* ─── MAP ─── */
#map{height:55vh;min-height:320px;max-height:500px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border-radius:12px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--font);font-size:13px}
.popup-title{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:2px}
.popup-date{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.popup-note{color:var(--text2);line-height:1.4}
.popup-thumb{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-top:8px;display:block}
.van-marker{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:3px solid var(--bg)}
.van-marker.current{background:var(--accent);box-shadow:0 0 0 6px rgba(212,132,90,.25),var(--shadow)}
.van-marker.past{background:#e8dfd2}

/* ─── TIMELINE ─── */
.timeline{padding:28px 20px 60px;max-width:680px;margin:0 auto;position:relative}
.timeline::before{content:'';position:absolute;left:34px;top:68px;bottom:60px;width:2px;background:linear-gradient(180deg,rgba(212,132,90,.3),rgba(212,132,90,.05))}
.timeline-title{font-family:var(--serif);font-size:22px;color:#2D2418;margin-bottom:24px}
.station{display:grid;grid-template-columns:50px 1fr;gap:14px;margin-bottom:32px;position:relative}
.station-date{text-align:center;z-index:1}
.station-day{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--text);line-height:1;background:var(--bg);padding:4px 0}
.station-month{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.station-flag{font-size:20px;margin-top:6px;background:var(--bg);padding:2px 0}
.station-name{font-family:var(--serif);font-size:20px;font-weight:600;color:#2D2418;margin-bottom:2px}
.station-country{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.station-note{font-family:var(--serif);font-size:15px;color:var(--text2);line-height:1.65;margin-bottom:12px;white-space:pre-wrap}
.station-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:10px}
.station-media img,.station-media video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:pointer;display:block;background:#e8e0d4;transition:opacity .15s}
.station-media img:hover,.station-media video:hover{opacity:.85}
.station-media .vid-wrap{position:relative;cursor:pointer}
.station-media .vid-wrap::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;text-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.station-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500}
.tag.km{background:var(--sage-bg);color:#6B7F5E}
.tag.fuel{background:var(--accent-bg);color:var(--accent2)}
.tag.oil{background:rgba(61,50,41,.06);color:var(--text3)}
@media(max-width:640px){
  .hero{padding:40px 16px 24px}
  .title{font-size:26px}
  .stats-banner{padding:14px 12px;gap:4px}
  .stat-val{font-size:24px}
  .timeline{padding:24px 16px 60px}
  .timeline::before{left:30px}
  .station{grid-template-columns:44px 1fr;gap:10px}
  .station-day{font-size:18px}
  .station-name{font-size:18px}
  .station-note{font-size:14px}
  .station-media{grid-template-columns:1fr 1fr;gap:4px}
}

/* ─── FOOTER ─── */
.foot{text-align:center;padding:24px 20px;border-top:1px solid var(--border);font-family:var(--hand);font-size:16px;color:var(--text3)}

/* ─── LIGHTBOX (Instagram-style swipe) ─── */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:1000;flex-direction:column;touch-action:pan-y}
.lb.show{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;flex-shrink:0;position:relative;z-index:3}
.lb-counter{font-family:var(--font);font-size:13px;color:rgba(255,255,255,.6)}
.lb-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:white;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-stage{flex:1;overflow:hidden;position:relative}
.lb-track{display:flex;height:100%;will-change:transform}
.lb-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lb-slide img,.lb-slide video{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.lb-slide video{pointer-events:auto}
.lb-nav{position:absolute;top:50%;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:white;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);z-index:4}
.lb-nav:disabled{opacity:.25;cursor:default}
.lb-prev{left:12px}
.lb-next{right:12px}
@media(max-width:640px){.lb-nav{display:none}}
.lb-dots{display:flex;justify-content:center;gap:5px;padding:14px;flex-shrink:0;flex-wrap:wrap;max-height:60px;overflow:hidden}
.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s,transform .2s}
.lb-dot.active{background:white;transform:scale(1.3)}

/* ─── EMPTY STATE ─── */
.empty{text-align:center;padding:80px 24px;color:var(--text3)}
.empty-emoji{font-size:48px;margin-bottom:16px}
.empty-title{font-family:var(--serif);font-size:22px;color:var(--text2);margin-bottom:8px}

/* ─── LOADING ─── */
.loading{display:flex;align-items:center;justify-content:center;padding:80px 24px;color:var(--text3)}
.spinner{width:24px;height:24px;border:3px solid #e8dfd2;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="eyebrow">✦ mit Groeni Richtung Balkan</div>
    <h1 class="title">Lisa und Dirks Reiselog</h1>
    <p class="subtitle">Karten, Etappen, Bilder — alles was unterwegs entsteht.</p>
    <div class="stats-banner" id="stats">
      <div><div class="stat-val" id="s-days">–</div><div class="stat-label">Tage</div></div>
      <div><div class="stat-val" id="s-km">–</div><div class="stat-label">Kilometer</div></div>
      <div><div class="stat-val" id="s-countries">–</div><div class="stat-label">Länder</div></div>
      <div><div class="stat-val" id="s-stops">–</div><div class="stat-label">Etappen</div></div>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="timeline">
  <h2 class="timeline-title">Etappen</h2>
  <div id="tl"><div class="loading"><div class="spinner"></div>Reise wird geladen…</div></div>
</div>

<div class="foot">Lisa & Dirk · Sommer 2026 · 🚐</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <div class="lb-top">
    <span class="lb-counter" id="lb-counter"></span>
    <button class="lb-close" onclick="closeLb()">×</button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button class="lb-nav lb-prev" id="lb-prev" onclick="lbNav(-1)">‹</button>
    <div class="lb-track" id="lb-track"></div>
    <button class="lb-nav lb-next" id="lb-next" onclick="lbNav(1)">›</button>
  </div>
  <div class="lb-dots" id="lb-dots"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const COUNTRIES={de:{n:'Deutschland',f:'🇩🇪'},at:{n:'Österreich',f:'🇦🇹'},it:{n:'Italien',f:'🇮🇹'},si:{n:'Slowenien',f:'🇸🇮'},hr:{n:'Kroatien',f:'🇭🇷'},ba:{n:'Bosnien',f:'🇧🇦'},me:{n:'Montenegro',f:'🇲🇪'},al:{n:'Albanien',f:'🇦🇱'},gr:{n:'Griechenland',f:'🇬🇷'}};
const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(iso){const d=new Date(iso);return{day:d.getDate(),month:MS[d.getMonth()],year:d.getFullYear()}}
function corrKm(r,f){return r*(1+(f||0)/100)}
function isVid(f){return/\.(mp4|mov|webm|m4v)$/i.test(f)}
let map,markers={};

async function load(){
  let data;
  try{const r=await fetch('public.php',{cache:'no-store'});data=await r.json()}
  catch(e){document.getElementById('tl').innerHTML='<div class="empty"><div class="empty-emoji">⚠️</div><div class="empty-title">Konnte Reise nicht laden</div></div>';return}
  if(!data.logs||!data.logs.length){document.getElementById('tl').innerHTML='<div class="empty"><div class="empty-emoji">🚐</div><div class="empty-title">Bald geht\'s los</div><div style="font-size:14px;color:#A0937E;">Die ersten Etappen erscheinen hier, sobald wir auf der Straße sind.</div></div>';initMap([46,14],5);return}
  stats(data);timeline(data);initMapRoute(data);
}

function stats(d){
  const l=d.logs,f=new Date(l[0].date),la=new Date(l[l.length-1].date);
  const days=Math.max(1,Math.round((la-f)/864e5)+1);
  const s=d.settings.startKm||0,mx=Math.max(...l.map(x=>x.km)),km=s>0?Math.round(corrKm(mx-s,d.settings.tireFactor)):0;
  const c=new Set(l.map(x=>x.country).filter(Boolean));
  document.getElementById('s-days').textContent=days;
  document.getElementById('s-km').textContent=km>0?km.toLocaleString('de-DE'):'–';
  document.getElementById('s-countries').textContent=c.size;
  document.getElementById('s-stops').textContent=l.length;
}

function timeline(d){
  const logs=[...d.logs].sort((a,b)=>b.date.localeCompare(a.date));
  const asc=[...d.logs].sort((a,b)=>a.date.localeCompare(b.date));
  const tf=d.settings.tireFactor;
  const kmMap={},vMap={};
  let pk=d.settings.startKm||0,pfk=pk;
  for(const e of asc){
    const di=e.km-pk;if(di>0&&pk>0)kmMap[e.id]=corrKm(di,tf);pk=e.km;
    if(e.liter>0){const fd=corrKm(e.km-pfk,tf);if(fd>0&&pfk>0)vMap[e.id]=e.liter/fd*100;pfk=e.km;}
  }
  // Zentrale Galerie-Map: id -> Foto-Array (robuster als inline JSON im onclick)
  window.galleries={};
  document.getElementById('tl').innerHTML=logs.map(l=>{
    const dt=fmt(l.date),c=COUNTRIES[l.country],flag=c?c.f:'📍';
    if(l.photos&&l.photos.length)window.galleries[l.id]=l.photos;
    const media=(l.photos||[]).map((f,i)=>{
      if(isVid(f)) return`<div class="vid-wrap" onclick="event.stopPropagation();openLb(window.galleries['${esc(l.id)}'],${i})"><video src="photos/${esc(f)}" muted preload="metadata" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:#e8e0d4"></video></div>`;
      return`<img src="photos/${esc(f)}" alt="" loading="lazy" onclick="event.stopPropagation();openLb(window.galleries['${esc(l.id)}'],${i})">`;
    }).join('');
    const tags=[];
    if(kmMap[l.id])tags.push(`<span class="tag km">${Math.round(kmMap[l.id]).toLocaleString('de-DE')} km</span>`);
    if(vMap[l.id])tags.push(`<span class="tag fuel">⛽ ${l.liter.toFixed(1)} L · ${vMap[l.id].toFixed(1)} L/100</span>`);
    if(l.oil!==undefined&&l.oil!==null)tags.push(`<span class="tag oil">Öl ${l.oil}%</span>`);
    return`<article class="station" data-id="${esc(l.id)}" data-lat="${l.gps.lat}" data-lon="${l.gps.lon}">
      <div class="station-date"><div class="station-day">${dt.day}</div><div class="station-month">${dt.month}</div><div class="station-flag">${flag}</div></div>
      <div>
        <div class="station-name">${esc(l.ortsname||(c?c.n:'Unterwegs'))}</div>
        <div class="station-country">${c?esc(c.n):''} · ${dt.day}. ${dt.month} ${dt.year}</div>
        ${l.reisenotiz?`<div class="station-note">${esc(l.reisenotiz)}</div>`:''}
        ${media?`<div class="station-media">${media}</div>`:''}
        ${tags.length?`<div class="station-tags">${tags.join('')}</div>`:''}
      </div>
    </article>`;
  }).join('');
  // Click -> map
  document.querySelectorAll('.station').forEach(el=>{
    el.addEventListener('click',()=>{
      const lat=+el.dataset.lat,lon=+el.dataset.lon,id=el.dataset.id;
      if(map){map.setView([lat,lon],Math.max(map.getZoom(),9),{animate:true});if(markers[id])markers[id].openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});}
    });
  });
}

function initMap(c,z){
  map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView(c,z);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd',maxZoom:19
  }).addTo(map);
}
function initMapRoute(d){
  const l=d.logs,pts=l.map(x=>[x.gps.lat,x.gps.lon]);
  initMap(pts[pts.length-1],6);
  if(pts.length>=2)L.polyline(pts,{color:'#D4845A',weight:3,opacity:.7,dashArray:'6 6'}).addTo(map);
  l.forEach((e,i)=>{
    const last=i===l.length-1,c=COUNTRIES[e.country],flag=c?c.f:'📍';
    const ic=L.divIcon({className:'',html:`<div class="van-marker ${last?'current':'past'}">${flag}</div>`,iconSize:[32,32],iconAnchor:[16,16]});
    const m=L.marker([e.gps.lat,e.gps.lon],{icon:ic}).addTo(map);
    const dt=fmt(e.date);
    m.bindPopup(`<div class="popup-date">${dt.day}. ${dt.month} ${dt.year}</div><div class="popup-title">${esc(e.ortsname||(c?c.n:''))}</div>${e.reisenotiz?`<div class="popup-note">${esc(e.reisenotiz.length>100?e.reisenotiz.slice(0,100)+'…':e.reisenotiz)}</div>`:''}`,{maxWidth:240});
    markers[e.id]=m;
  });
  if(pts.length>=2)map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:9});
}

// ─── LIGHTBOX mit echtem Swipe (Instagram-Stil) ──────────────────────────────
let lbFiles=[],lbIdx=0;
let lbStartX=0,lbStartY=0,lbDragging=false,lbWidth=0,lbLocked=null;

function buildTrack(){
  const track=document.getElementById('lb-track');
  track.innerHTML=lbFiles.map(f=>{
    if(isVid(f)){
      return`<div class="lb-slide"><video src="photos/${esc(f)}" controls playsinline preload="metadata"></video></div>`;
    }
    return`<div class="lb-slide"><img src="photos/${esc(f)}" alt="" draggable="false"></div>`;
  }).join('');
}

function openLb(files,idx){
  lbFiles=files;lbIdx=idx||0;
  document.getElementById('lb').classList.add('show');
  buildTrack();
  // Breite erst nach dem Layout-Reflow lesen (display:flex muss aktiv sein)
  requestAnimationFrame(()=>{
    lbWidth=document.getElementById('lb-stage').clientWidth;
    positionTrack(false);
    updateLbChrome();
  });
}
function closeLb(){
  document.querySelectorAll('#lb-track video').forEach(v=>{try{v.pause()}catch(e){}});
  document.getElementById('lb').classList.remove('show');
}
function lbNav(dir){
  const ni=lbIdx+dir;
  if(ni<0||ni>=lbFiles.length)return;
  lbIdx=ni;
  positionTrack(true);
  updateLbChrome();
}
function positionTrack(animate){
  const track=document.getElementById('lb-track');
  track.style.transition=animate?'transform .28s cubic-bezier(.22,.61,.36,1)':'none';
  track.style.transform=`translateX(${-lbIdx*lbWidth}px)`;
  document.querySelectorAll('#lb-track video').forEach((v,i)=>{if(i!==lbIdx){try{v.pause()}catch(e){}}});
}
function updateLbChrome(){
  document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+lbFiles.length;
  const prev=document.getElementById('lb-prev'),next=document.getElementById('lb-next');
  prev.disabled=lbIdx===0;next.disabled=lbIdx===lbFiles.length-1;
  const dots=document.getElementById('lb-dots');
  if(lbFiles.length>1){
    dots.style.display='flex';
    dots.innerHTML=lbFiles.map((_,i)=>`<div class="lb-dot${i===lbIdx?' active':''}"></div>`).join('');
  }else{dots.style.display='none'}
}

const stage=document.getElementById('lb-stage');
stage.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  lbStartX=e.touches[0].clientX;
  lbStartY=e.touches[0].clientY;
  lbDragging=true;lbLocked=null;
  lbWidth=stage.clientWidth;
},{passive:true});

stage.addEventListener('touchmove',e=>{
  if(!lbDragging||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-lbStartX;
  const dy=e.touches[0].clientY-lbStartY;
  if(lbLocked===null){lbLocked=Math.abs(dx)>Math.abs(dy)?'x':'y'}
  if(lbLocked==='x'){
    let d=dx;
    if((lbIdx===0&&dx>0)||(lbIdx===lbFiles.length-1&&dx<0))d=dx*0.35;
    const track=document.getElementById('lb-track');
    track.style.transition='none';
    track.style.transform=`translateX(${-lbIdx*lbWidth+d}px)`;
  }
},{passive:true});

stage.addEventListener('touchend',e=>{
  if(!lbDragging)return;
  lbDragging=false;
  const dx=e.changedTouches[0].clientX-lbStartX;
  const dy=e.changedTouches[0].clientY-lbStartY;
  if(lbLocked==='y'&&Math.abs(dy)>90&&Math.abs(dy)>Math.abs(dx)){closeLb();return}
  if(lbLocked==='x'){
    const threshold=lbWidth*0.2;
    if(dx<-threshold&&lbIdx<lbFiles.length-1){lbIdx++}
    else if(dx>threshold&&lbIdx>0){lbIdx--}
    positionTrack(true);
    updateLbChrome();
  }
},{passive:true});

stage.addEventListener('click',e=>{
  if(e.target===stage||e.target.classList.contains('lb-slide')||e.target.classList.contains('lb-track'))closeLb();
});

document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('show'))return;
  if(e.key==='ArrowLeft')lbNav(-1);
  else if(e.key==='ArrowRight')lbNav(1);
  else if(e.key==='Escape')closeLb();
});
